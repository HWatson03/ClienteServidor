spring.application.name=ClienteServidor

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_servidor_local}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Almacenamiento de archivos (fuera del repositorio)
app.storage.root=${STORAGE_ROOT:/home/usic03/IdeaProjects/ClienteServidor/storage/archivos}
app.storage.temp=${STORAGE_TEMP:/home/usic03/IdeaProjects/ClienteServidor/storage/tmp}

# Cuota por usuario (bytes)
app.cuota.max-bytes=${CUOTA_MAX_BYTES:1000000000}

# Servidor
server.servlet.context-path=/
server.port=${SERVER_PORT:8080}

# CORS (separar los orígenes por coma; definir en backend/.env)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Bootstrap del primer usuario (solo si la base está vacía)
app.bootstrap.usuario=${BOOTSTRAP_USUARIO:}
app.bootstrap.contrasena=${BOOTSTRAP_CONTRASENA:}
