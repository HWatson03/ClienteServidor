spring.application.name=ClienteServidor

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_servidor_local}
spring.datasource.username=${DB_USERNAME:appu}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Almacenamiento de archivos (fuera del repositorio)
app.storage.root=${STORAGE_ROOT:/home/usic03/IdeaProjects/ClienteServidor/storage/archivos}
app.storage.temp=${STORAGE_TEMP:/home/usic03/IdeaProjects/ClienteServidor/storage/tmp}

# Cuota por usuario (bytes)
app.cuota.max-bytes=${CUOTA_MAX_BYTES:1000000000}

# Servidor
server.servlet.context-path=/
server.port=${SERVER_PORT:8080}
